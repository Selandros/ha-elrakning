name: P0 Audit 1 Gate

on:
  push:
    branches:
      - p0-audit-1-source-agnostic
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Stockholm
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: base-019c24a
            ref: 019c24a4798cbdb0c1084a261b1cc78a9645907f
          - label: p0-audit-1-head
            ref: p0-audit-1-source-agnostic
    name: gate-${{ matrix.label }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check aiohttp voluptuous pypdf==6.15.0

      - name: Python tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: JavaScript tests
        shell: bash
        run: |
          set -uo pipefail
          status=0
          for test_file in tests/test_*.mjs; do
            echo "==> ${test_file}"
            if ! node "${test_file}"; then
              status=1
            fi
          done
          exit "${status}"
