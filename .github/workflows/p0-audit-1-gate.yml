name: P0 Release Gate

on:
  push:
    branches:
      - p0-audit-1-source-agnostic
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Stockholm
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v4
        with:
          ref: release/0.0.604-economic-frames
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check aiohttp voluptuous pypdf==6.15.0

      - name: Python tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Python compileall
        run: python -m compileall -q custom_components tests tools

      - name: JavaScript and MJS syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --check "$file"
          done < <(git ls-files '*.js' '*.mjs')

      - name: JSON parse
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          files = subprocess.check_output(
              ["git", "ls-files", "*.json"], text=True
          ).splitlines()
          for filename in files:
              with Path(filename).open(encoding="utf-8") as handle:
                  json.load(handle)
          print(f"validated {len(files)} JSON files")
          PY

      - name: Diff check from 0.0.603 baseline
        run: git diff --check ad4b442a911f89436678701f20c5e5becad919cd..HEAD
