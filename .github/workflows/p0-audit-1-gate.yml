name: P0 Audit 1 Gate

on:
  push:
    branches:
      - p0-audit-1-source-agnostic
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check aiohttp voluptuous pypdf==6.15.0

      - name: Python tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: JavaScript tests
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/test_*.mjs; do
            echo "==> ${test_file}"
            node "${test_file}"
          done
